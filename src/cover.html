<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=630, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 630px; height: 500px;
    background: linear-gradient(135deg, #FDF6E3 0%, #F5E6D3 30%, #E8D5F5 60%, #D5E8F5 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Background puzzle pieces */
  .bg-block {
    position: absolute;
    border-radius: 10px;
    opacity: 0.3;
  }
  .bg-block:nth-child(1) { width:40px; height:40px; background:#FF6B6B; top:30px; left:40px; transform:rotate(10deg); }
  .bg-block:nth-child(2) { width:35px; height:35px; background:#4ECDC4; top:60px; right:50px; transform:rotate(-15deg); }
  .bg-block:nth-child(3) { width:38px; height:38px; background:#FFE66D; bottom:50px; left:60px; transform:rotate(20deg); }
  .bg-block:nth-child(4) { width:42px; height:42px; background:#A8E6CF; top:120px; left:110px; transform:rotate(-8deg); }
  .bg-block:nth-child(5) { width:36px; height:36px; background:#FF8B94; bottom:80px; right:70px; transform:rotate(12deg); }
  .bg-block:nth-child(6) { width:34px; height:34px; background:#B8D4F5; top:200px; right:30px; transform:rotate(-20deg); }
  .bg-block:nth-child(7) { width:40px; height:40px; background:#F8B4C8; bottom:120px; left:200px; transform:rotate(5deg); }

  /* Stars */
  .star {
    position: absolute;
    font-size: 18px;
    opacity: 0.5;
  }
  .star:nth-child(8) { top:25px; left:180px; }
  .star:nth-child(9) { top:50px; right:100px; }
  .star:nth-child(10) { bottom:40px; left:350px; }
  .star:nth-child(11) { top:150px; right:150px; }

  /* Main card */
  .card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 40px 50px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
    text-align: center;
    position: relative;
    z-index: 1;
    border: 3px solid rgba(255,255,255,0.6);
  }

  /* Animals row */
  .animals {
    font-size: 56px;
    letter-spacing: 8px;
    margin-bottom: 16px;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.1));
  }

  h1 {
    font-size: 36px;
    font-weight: 800;
    color: #2D3436;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  h1 span {
    background: linear-gradient(135deg, #FF6B6B, #FF8E53);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 16px;
    color: #636E72;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }

  .pills {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
  }
  .pill {
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .pill-puzzle { background: #FFEAA7; color: #D68910; }
  .pill-cute { background: #FFD1D1; color: #E74C3C; }
  .pill-casual { background: #D5F5E3; color: #27AE60; }
  .pill-cozy { background: #D6EAF8; color: #2980B9; }

  /* Bottom bar */
  .bottom-bar {
    margin-top: 55px;
    font-size: 12px;
    color: #B2BEC3;
    letter-spacing: 2px;
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>
<div class="bg-block"></div><div class="bg-block"></div><div class="bg-block"></div>
<div class="bg-block"></div><div class="bg-block"></div><div class="bg-block"></div>
<div class="bg-block"></div>
<div class="star">✦</div><div class="star">✦</div><div class="star">✦</div><div class="star">✦</div>

<div class="card">
  <div class="animals">🐱 🐶 🐰 🦊 🐻</div>
  <h1>Sorting <span>Shelter</span> Pro</h1>
  <div class="subtitle">SORT BLOCKS · RESCUE CUTE ANIMALS</div>
  <div class="pills">
    <span class="pill pill-puzzle">🧩 Puzzle</span>
    <span class="pill pill-cute">🐾 Cute</span>
    <span class="pill pill-casual">🎮 Casual</span>
    <span class="pill pill-cozy">☕ Cozy</span>
  </div>
</div>

<div class="bottom-bar">PLAY NOW · NO DOWNLOAD · MOBILE FRIENDLY</div>
</body>
</html>
